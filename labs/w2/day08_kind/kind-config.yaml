kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=rack-a"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "topology.kubernetes.io/zone=rack-b"

# 用法（Day 8）：
#   kind create cluster --name llmops --config labs/w2/day08_kind/kind-config.yaml
#   kubectl get nodes -L topology.kubernetes.io/zone
#
# 两个 worker 分属 rack-a / rack-b 是有意为之：
#   Day 10 的 Volcano 故障域打散、Day 20 演练 5 的节点级故障都要用它。
